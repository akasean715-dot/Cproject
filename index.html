<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cake Order Tracker</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d35400">
</head>
<body>
  <h1>Cake Order Tracker</h1>
  <div class="income-boxes">
  <div class="income-box">
    <h3>Total Monthly Income</h3>
    <p>₹<span id="monthlyTotal">0</span></p>
  </div>

  <div class="income-box">
    <h3>Total Annual Income</h3>
    <p>₹<span id="annualTotal">0</span></p>
  </div>
</div>

  <!-- Order Form -->
  <form id="orderForm">
    <input type="text" id="customerName" placeholder="Customer Name" required>
    <input type="text" id="cakeType" placeholder="Cake Type" required>
    <input type="number" id="cakePrice" placeholder="Cake Price (₹)" min="0" required>
    <input type="datetime-local" id="orderDateTime" required>
    <button type="submit">Add Order</button>
  </form>

  <!-- Orders List -->
  <h2>Upcoming Orders</h2>
  <ul id="orderList"></ul>
  <!-- Firebase SDK -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } 
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAOLlqzezG31BE97H4IcKo0DPHwVjKbUfU",
      authDomain: "shanlang-167ed.firebaseapp.com",
      projectId: "shanlang-167ed",
      storageBucket: "shanlang-167ed.firebasestorage.app",
      messagingSenderId: "1007124980142",
      appId: "1:1007124980142:web:2eaac00729da040e75e83f",
      measurementId: "G-6RZVB443C4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db; // make Firestore available to script.js
  </script>

  <!-- Script should be at the end of body -->
  <script type="module" src="script.js"></script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => console.log("Service Worker registered"))
        .catch((error) => console.error("Service Worker registration failed:", error));
    });
  }
</script>
</body>
</html>
